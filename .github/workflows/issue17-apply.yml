name: Apply Issue 17 Fix

on:
  push:
    branches:
      - fix/issue-17-legacy-exit-semantics

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/issue-17-legacy-exit-semantics
          fetch-depth: 0
      - name: Confirm focused regression is RED
        shell: pwsh
        run: |
          ./project/tests/command-runner-regression.ps1
          if ($LASTEXITCODE -eq 0) { throw 'Expected RED before implementation' }
          exit 0
      - name: Apply fix
        shell: bash
        run: python3 project/tools/issue17-apply.py
      - name: Refresh Base index
        shell: pwsh
        run: ./.kinotch/scripts/knt.ps1 base-refresh
      - name: Focused regression GREEN
        shell: pwsh
        run: ./project/tests/command-runner-regression.ps1
      - name: Direct Base self-test
        shell: pwsh
        run: ./.kinotch/tests/run-tests.ps1
      - name: Base integrity
        shell: pwsh
        run: ./.kinotch/scripts/knt.ps1 base-check
      - name: Full verification
        shell: pwsh
        run: ./.kinotch/scripts/knt.ps1 verify
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "KiNoTch. automation"
          git config user.email "79015263+kinoko34077@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve compound legacy native exit semantics"
          git push origin HEAD:fix/issue-17-legacy-exit-semantics
