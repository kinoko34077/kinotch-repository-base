name: Apply Issue 14 v2 Fix

on:
  push:
    branches:
      - fix/issue-14-devflow-identity-v2

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/issue-14-devflow-identity-v2
          fetch-depth: 0

      - name: Confirm identity regression is RED
        shell: pwsh
        run: |
          & pwsh -NoProfile -File project/tests/devflow-identity-regression.ps1
          if ($LASTEXITCODE -eq 0) { throw 'Expected stale devflow identity regression to fail before implementation' }
          exit 0

      - name: Apply current devflow identity and Base version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old_identity = 'kinoko34077/devflow-test'
          new_identity = 'kinoko34077/devflow'
          for path in [
              Path('.kinotch/meta/08_GITHUB_DEVELOPMENT_CONTROL.md'),
              Path('.kinotch/AGENT_RULES.md'),
          ]:
              text = path.read_text(encoding='utf-8')
              if old_identity not in text:
                  raise SystemExit(f'expected stale current identity not found in {path}')
              path.write_text(text.replace(old_identity, new_identity), encoding='utf-8', newline='\n')

          Path('.kinotch/BASE_VERSION').write_text('0.5.8\n', encoding='utf-8', newline='\n')

          readme = Path('.kinotch/README_BASE.md')
          text = readme.read_text(encoding='utf-8')
          old_version = 'Base version: `0.5.7`'
          if old_version not in text:
              raise SystemExit('expected README Base version 0.5.7 not found')
          text = text.replace(old_version, 'Base version: `0.5.8`', 1)
          old_release = 'Base v0.5.7は、v0.5.6の安全境界を維持しつつ、Project commandのLASTEXITCODE resetをprocess-wide automatic variableへ統一し、legacy commandの終端PowerShell状態・native exit code・実際に出力されたErrorRecordを分離して判定する保守releaseである。'
          new_release = 'Base v0.5.8は、v0.5.7のProject command結果判定を維持しつつ、横断GitHub開発管理の現行正本を `kinoko34077/devflow` へ統一し、歴史的な `devflow-test` identityを現行Agent bootstrapから除去する保守releaseである。'
          if old_release not in text:
              raise SystemExit('expected README v0.5.7 release paragraph not found')
          readme.write_text(text.replace(old_release, new_release, 1), encoding='utf-8', newline='\n')

          tests = Path('.kinotch/tests/run-tests.ps1')
          text = tests.read_text(encoding='utf-8')
          old_bump = 'Set-Content -LiteralPath (Join-Path $root ".kinotch/BASE_VERSION") -Value "0.5.8" -NoNewline'
          old_assert = 'Assert-Equal "0.5.7" $baseVersion "Base version"'
          if old_bump not in text or old_assert not in text:
              raise SystemExit('expected Base 0.5.7 self-test markers not found')
          text = text.replace(old_bump, 'Set-Content -LiteralPath (Join-Path $root ".kinotch/BASE_VERSION") -Value "0.5.9" -NoNewline', 1)
          text = text.replace(old_assert, 'Assert-Equal "0.5.8" $baseVersion "Base version"', 1)
          tests.write_text(text, encoding='utf-8', newline='\n')

          # Remove this maintenance workflow before Base index refresh and shape/self-tests.
          Path('.github/workflows/issue14-v2-apply.yml').unlink()
          PY

      - name: Refresh Base index
        shell: pwsh
        run: ./.kinotch/scripts/knt.ps1 base-refresh

      - name: Confirm identity regression is GREEN
        shell: pwsh
        run: ./project/tests/devflow-identity-regression.ps1

      - name: Base integrity
        shell: pwsh
        run: ./.kinotch/scripts/knt.ps1 base-check

      - name: Full verification
        shell: pwsh
        run: ./.kinotch/scripts/knt.ps1 verify

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "KiNoTch. automation"
          git config user.email "79015263+kinoko34077@users.noreply.github.com"
          git add -A
          git commit -m "fix: point Base integration to current devflow identity"
          git push origin HEAD:fix/issue-14-devflow-identity-v2
