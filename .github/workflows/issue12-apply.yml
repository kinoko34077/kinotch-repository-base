name: Apply Issue 12 Fix

on:
  push:
    branches:
      - fix/issue-12-command-results

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/issue-12-command-results
          fetch-depth: 0
      - name: Apply focused runner fix
        run: python project/tests/apply-issue12.py
      - name: Refresh Base index
        shell: pwsh
        run: ./.kinotch/scripts/knt.ps1 base-refresh
      - name: Focused regression
        shell: pwsh
        run: ./project/tests/command-runner-regression.ps1
      - name: Base integrity
        shell: pwsh
        run: ./.kinotch/scripts/knt.ps1 base-check
      - name: Full verification
        shell: pwsh
        run: ./.kinotch/scripts/knt.ps1 verify
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "KiNoTch. automation"
          git config user.email "79015263+kinoko34077@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden project command result semantics"
          git push origin HEAD:fix/issue-12-command-results
