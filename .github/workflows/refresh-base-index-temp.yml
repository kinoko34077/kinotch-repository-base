name: Refresh Base Index Temp

on:
  push:
    branches:
      - work/devflow-control-alignment

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: work/devflow-control-alignment
      - name: Refresh Base index
        shell: pwsh
        run: ./.kinotch/scripts/update-base-index.ps1 -BaseRoot .
      - name: Commit generated index if changed
        shell: bash
        run: |
          if git diff --quiet -- .kinotch/base-files.json .kinotch/FILE_INVENTORY.txt; then
            echo "No generated index changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .kinotch/base-files.json .kinotch/FILE_INVENTORY.txt
          git commit -m "chore: refresh Base file index"
          git push origin HEAD:work/devflow-control-alignment
