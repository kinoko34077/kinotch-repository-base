name: Apply Issue 13 Fix

on:
  push:
    branches:
      - fix/issue-13-mcp-path-boundary

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/issue-13-mcp-path-boundary
          fetch-depth: 0
      - name: Confirm regression is RED before implementation
        shell: bash
        run: |
          set +e
          pwsh -NoProfile -File project/tests/mcp-path-regression.ps1
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "Expected MCP link-boundary regression to fail before implementation"
            exit 1
          fi
          echo "RED confirmed with exit $code"
      - name: Apply focused MCP boundary fix
        run: python project/tests/apply-issue13.py
      - name: Refresh Base index
        shell: pwsh
        run: ./.kinotch/scripts/knt.ps1 base-refresh
      - name: Confirm regression is GREEN
        shell: pwsh
        run: ./project/tests/mcp-path-regression.ps1
      - name: Base integrity
        shell: pwsh
        run: ./.kinotch/scripts/knt.ps1 base-check
      - name: Full verification
        shell: pwsh
        run: ./.kinotch/scripts/knt.ps1 verify
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "KiNoTch. automation"
          git config user.email "79015263+kinoko34077@users.noreply.github.com"
          git add -A
          git commit -m "fix: enforce MCP physical path boundary"
          git push origin HEAD:fix/issue-13-mcp-path-boundary
