name: Probe Issue 17 Status

on:
  push:
    branches:
      - fix/issue-17-legacy-exit-semantics

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: pwsh
          - os: windows-latest
            shell: pwsh
          - os: windows-latest
            shell: powershell
    runs-on: ${{ matrix.os }}
    steps:
      - name: Probe global reset in function
        shell: ${{ matrix.shell }}
        run: |
          $ErrorActionPreference = 'Continue'
          $h = if ($PSVersionTable.PSEdition -eq 'Desktop') { (Get-Command powershell -ErrorAction Stop).Source } else { (Get-Command pwsh -ErrorAction Stop).Source }

          function Probe-GlobalReset {
            param([string]$Exe, [int]$ExitCode)
            $global:LASTEXITCODE = 41
            $global:LASTEXITCODE = $null
            $status = [pscustomobject]@{ Success = $null; ScriptNative = $null; FunctionNative = $null; GlobalNative = $null }
            $code = "if (`$true) { & '$Exe' -NoProfile -Command 'exit $ExitCode' } else { Write-Output 'unused' }" + [Environment]::NewLine + '$status.Success = $?' + [Environment]::NewLine + '$status.ScriptNative = $LASTEXITCODE'
            $captured = @(Invoke-Expression $code 2>&1)
            $status.FunctionNative = $LASTEXITCODE
            $status.GlobalNative = $global:LASTEXITCODE
            Write-Host "GLOBALRESET success=$($status.Success) script=$($status.ScriptNative) function=$($status.FunctionNative) global=$($status.GlobalNative) captured=$($captured.Count)"
            if ($status.Success -ne $false -or [int]$status.ScriptNative -ne $ExitCode -or [int]$status.GlobalNative -ne $ExitCode) { throw 'global reset did not preserve native exit' }
          }

          function Probe-GlobalResetPowerShellOnly {
            $global:LASTEXITCODE = 41
            $global:LASTEXITCODE = $null
            $status = [pscustomobject]@{ Success = $null; ScriptNative = 'unset' }
            $code = "Write-Output 'success'" + [Environment]::NewLine + '$status.Success = $?' + [Environment]::NewLine + '$status.ScriptNative = $LASTEXITCODE'
            $captured = @(Invoke-Expression $code 2>&1)
            Write-Host "PSONLY success=$($status.Success) script=$($status.ScriptNative) global=$global:LASTEXITCODE captured=$($captured.Count)"
            if ($status.Success -ne $true -or $null -ne $status.ScriptNative -or $null -ne $global:LASTEXITCODE) { throw 'global reset did not clear stale exit for PowerShell-only expression' }
          }

          Probe-GlobalReset -Exe $h -ExitCode 7
          Probe-GlobalResetPowerShellOnly
