name: Probe Issue 17 Status

on:
  push:
    branches:
      - fix/issue-17-legacy-exit-semantics

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe router-equivalent capture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $h = (Get-Command pwsh -ErrorAction Stop).Source
          $LASTEXITCODE = $null
          $status = [pscustomobject]@{ Success = $null; Native = $null }
          $code = "if (`$true) { & '$h' -NoProfile -Command 'exit 7' } else { Write-Output 'unused' }" + [Environment]::NewLine + '$status.Success = $?' + [Environment]::NewLine + '$status.Native = $LASTEXITCODE'
          $captured = @(Invoke-Expression $code 2>&1)
          Write-Host "CAPTURED success=$($status.Success) native=$($status.Native) count=$($captured.Count)"
          foreach ($item in $captured) {
            Write-Host "ITEM type=$($item.GetType().FullName) fqid=$([string]$item.FullyQualifiedErrorId) text=$item"
          }
          exit 0
