name: Apply Issue 20 Current State

on:
  push:
    branches:
      - docs/issue-20-current-state-reconcile

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: docs/issue-20-current-state-reconcile
          fetch-depth: 0
      - name: Reconcile CURRENT_STATE from verified live evidence
        shell: python
        run: |
          from pathlib import Path
          p = Path('project/docs/CURRENT_STATE.md')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ('Base version: `0.5.4`', 'Base version: `0.5.8`'),
              ('Last verified: 2026-09-26 — v0.5.4 command execution compatibility fix complete; Hosted CI passed 105/105 self-tests on Ubuntu PowerShell, Windows PowerShell Core, and Windows PowerShell 5.1.',
               'Last verified: 2026-09-27 — Base v0.5.8 devflow-identity maintenance merged after exact-head hosted verification passed on Ubuntu PowerShell, Windows PowerShell Core, and Windows PowerShell 5.1; Base self-tests remained 105/105 with focused command, MCP-path, and devflow-identity regressions passing.'),
              ('- Base v0.5.4 is the current Surface Default Kit safety/lifecycle release; existing adopted repositories\n  are synchronized only during their normal maintenance cycle.',
               '- Base v0.5.8 is the current Repository Base maintenance baseline. Live checks on 2026-09-27 confirm `kinotch-runtime` and the dedicated `kinotch-default-canary` each still embed Base v0.5.4 with their current main verification green; consumer repositories are synchronized only during their normal maintenance cycle.'),
              ('- Base v0.5.4 is the current Phase 5 safety baseline; Runtime semantics remain\n  unchanged and existing repositories are not bulk-migrated.',
               '- Base v0.5.8 is the current Phase 5 safety baseline; Runtime semantics remain\n  unchanged and existing repositories are not bulk-migrated. Runtime and Default Canary embedded Base versions are tracked by their own repositories rather than inferred from the Base baseline.'),
              ('- Hosted CI self-test result: 105/105 passed, 0 failed, 0 skipped across all three verification environments',
               '- Hosted Base v0.5.8 verification: 105/105 Base self-tests, 8/8 command-runner regressions, 4/4 MCP path regressions, and the devflow identity regression passed on Ubuntu PowerShell, Windows PowerShell Core, and Windows PowerShell 5.1')
          ]
          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one occurrence, got {count}: {old!r}')
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
      - name: Commit documentation-only change and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'KiNoTch. automation'
          git config user.email '79015263+kinoko34077@users.noreply.github.com'
          git rm .github/workflows/issue20-current-state-apply.yml
          git add project/docs/CURRENT_STATE.md
          changed="$(git diff --cached --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'.github/workflows/issue20-current-state-apply.yml\nproject/docs/CURRENT_STATE.md'
          git commit -m 'docs: reconcile current Base Runtime and Canary state'
          git push origin HEAD:docs/issue-20-current-state-reconcile
