name: Apply Issue 18 Shape Fixture Isolation

on:
  push:
    branches:
      - fix/issue-18-shape-fixture-isolation

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/issue-18-shape-fixture-isolation
          fetch-depth: 0

      - name: Reproduce pre-fix workflow contamination
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tempRoot = Join-Path $env:RUNNER_TEMP ('issue18-red-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $tempRoot -Force | Out-Null
          try {
            Get-ChildItem -Force $PWD | Where-Object { $_.Name -notin @('.git', '.superpowers', 'project') } | Copy-Item -Destination $tempRoot -Recurse -Force
            $workflowRoot = Join-Path $tempRoot '.github/workflows'
            New-Item -ItemType Directory -Path $workflowRoot -Force | Out-Null
            Set-Content -LiteralPath (Join-Path $workflowRoot 'verify.yml') -Value "name: Deploy`nrun: wrangler deploy" -NoNewline
            Set-Content -LiteralPath (Join-Path $workflowRoot 'incidental-maintenance.yml') -Value "name: Maintenance Verify`nrun: npm test" -NoNewline
            Set-Content -LiteralPath (Join-Path $tempRoot 'package.json') -Value '{"scripts":{"test":"node --test","build":"vite build"},"devDependencies":{"vite":"latest"}}' -NoNewline
            New-Item -ItemType Directory -Path (Join-Path $tempRoot 'public') -Force | Out-Null
            Set-Content -LiteralPath (Join-Path $tempRoot 'public/manifest.json') -Value '{"name":"Shape","start_url":"/"}' -NoNewline
            Set-Content -LiteralPath (Join-Path $tempRoot 'service-worker.js') -Value "self.addEventListener('fetch', () => {});" -NoNewline
            $router = Join-Path $tempRoot '.kinotch/scripts/knt.ps1'
            $baseSource = Join-Path $PWD '.kinotch'
            $output = @(& pwsh -NoProfile -ExecutionPolicy Bypass -File $router -RootOverride $tempRoot -BaseOverride $baseSource migrate 2>&1) -join [Environment]::NewLine
            if ($LASTEXITCODE -ne 0) { throw "pre-fix shape probe failed unexpectedly: $output" }
            if ($output -notmatch "Candidate Default Pack 'ci-test': state OVERRIDE") {
              throw "RED reproduction failed: incidental verification workflow did not contaminate deploy-only classification"
            }
            Write-Host '[RED CONFIRMED] incidental verification workflow contaminates deploy-only fixture classification'
          }
          finally {
            Remove-Item -LiteralPath $tempRoot -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Apply deterministic fixture isolation and permanent regression
        shell: python
        run: |
          from pathlib import Path

          tests = Path('.kinotch/tests/run-tests.ps1')
          s = tests.read_text(encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 anchor, found {count}')
              return text.replace(old, new, 1)

          param_old = '[string]$WorkflowText = "name: Verify`nrun: npm test",\n        [string]$PackageJson'
          param_new = '[string]$WorkflowText = "name: Verify`nrun: npm test",\n        [string]$IncidentalWorkflowText = "",\n        [string]$PackageJson'
          s = replace_once(s, param_old, param_new, 'shape fixture parameter')

          workflow_dir_old = '        New-Item -ItemType Directory -Path (Join-Path $tempRoot ".github/workflows") -Force | Out-Null'
          workflow_dir_new = '''        $workflowRoot = Join-Path $tempRoot ".github/workflows"
          New-Item -ItemType Directory -Path $workflowRoot -Force | Out-Null
          if (-not [string]::IsNullOrWhiteSpace($IncidentalWorkflowText)) {
              Set-Content -LiteralPath (Join-Path $workflowRoot "incidental-maintenance.yml") -Value $IncidentalWorkflowText -NoNewline
          }
          $baseWorkflowText = $null
          if ($UseBaseWorkflow) {
              $baseWorkflowText = Get-Content -Raw -Encoding UTF8 (Join-Path $RepoRoot ".github/workflows/verify.yml")
          }
          Remove-Item -LiteralPath $workflowRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $workflowRoot -Force | Out-Null'''
          s = replace_once(s, workflow_dir_old, workflow_dir_new, 'shape workflow directory setup')

          workflow_write_old = '''        if (-not $UseBaseWorkflow) {
              Set-Content -LiteralPath (Join-Path $tempRoot ".github/workflows/verify.yml") -Value $WorkflowText -NoNewline
          }'''
          workflow_write_new = '''        if ($UseBaseWorkflow) {
              [IO.File]::WriteAllText((Join-Path $workflowRoot "verify.yml"), $baseWorkflowText, (New-Object System.Text.UTF8Encoding($false)))
          }
          else {
              Set-Content -LiteralPath (Join-Path $workflowRoot "verify.yml") -Value $WorkflowText -NoNewline
          }'''
          s = replace_once(s, workflow_write_old, workflow_write_new, 'shape intended workflow write')

          marker = 'Invoke-TestCase "shape probe distinguishes generated files from integrity checks" {'
          regression = '''Invoke-TestCase "shape probe isolates incidental repository workflows" {
              $incidentalVerification = "name: Maintenance Verify`nrun: npm test"
              $incidentalDeploy = "name: Maintenance Deploy`nrun: wrangler deploy"
              Invoke-KntShapeMigrateFixture -WorkflowText "name: Deploy`nrun: wrangler deploy" -IncidentalWorkflowText $incidentalVerification -AssertOutput {
                  param($root, $output)
                  $workflowFiles = @(Get-ChildItem -LiteralPath (Join-Path $root ".github/workflows") -File)
                  Assert-Equal 1 $workflowFiles.Count "deploy-only isolated workflow count"
                  Assert-Equal "verify.yml" $workflowFiles[0].Name "deploy-only isolated workflow name"
                  Assert-True ($output -match "Candidate Default Pack 'ci-test': state DEFAULT") "incidental verification workflow contaminated deploy-only fixture"
              }
              Invoke-KntShapeMigrateFixture -WorkflowText "name: Verify`nrun: npm test" -IncidentalWorkflowText $incidentalDeploy -AssertOutput {
                  param($root, $output)
                  $workflowFiles = @(Get-ChildItem -LiteralPath (Join-Path $root ".github/workflows") -File)
                  Assert-Equal 1 $workflowFiles.Count "verification isolated workflow count"
                  Assert-Equal "verify.yml" $workflowFiles[0].Name "verification isolated workflow name"
                  Assert-True ($output -match "Candidate Default Pack 'ci-test': state OVERRIDE") "intended verification workflow was not preserved"
              }
              Invoke-KntShapeMigrateFixture -UseBaseWorkflow -IncidentalWorkflowText $incidentalVerification -AssertOutput {
                  param($root, $output)
                  $workflowFiles = @(Get-ChildItem -LiteralPath (Join-Path $root ".github/workflows") -File)
                  Assert-Equal 1 $workflowFiles.Count "Base-workflow isolated workflow count"
                  Assert-Equal "verify.yml" $workflowFiles[0].Name "Base-workflow isolated workflow name"
                  Assert-True ($output -notmatch "Candidate Default Pack 'ci-test'") "incidental workflow contaminated Base-common-workflow fixture"
              }
          }
          '''
          if s.count(marker) != 1:
              raise SystemExit(f'shape regression insertion marker count={s.count(marker)}')
          s = s.replace(marker, regression + marker, 1)

          s = replace_once(
              s,
              'Set-Content -LiteralPath (Join-Path $root ".kinotch/BASE_VERSION") -Value "0.5.9" -NoNewline',
              'Set-Content -LiteralPath (Join-Path $root ".kinotch/BASE_VERSION") -Value "0.5.10" -NoNewline',
              'next-version self-test')
          s = replace_once(
              s,
              'Assert-Equal "0.5.8" $baseVersion "Base version"',
              'Assert-Equal "0.5.9" $baseVersion "Base version"',
              'Base version assertion')
          tests.write_text(s, encoding='utf-8')

          version = Path('.kinotch/BASE_VERSION')
          if version.read_text(encoding='utf-8').strip() != '0.5.8':
              raise SystemExit('unexpected starting Base version')
          version.write_text('0.5.9\n', encoding='utf-8')

          readme = Path('.kinotch/README_BASE.md')
          r = readme.read_text(encoding='utf-8')
          r = replace_once(r, 'Base version: `0.5.8`', 'Base version: `0.5.9`', 'README Base version')
          old_release = 'Base v0.5.8は、v0.5.7のProject command結果判定を維持しつつ、横断GitHub開発管理の現行正本を `kinoko34077/devflow` へ統一し、歴史的な `devflow-test` identityを現行Agent bootstrapから除去する保守releaseである。'
          new_release = 'Base v0.5.9は、v0.5.8のdevflow identity整合とProject command結果判定を維持しつつ、shape-probe self-test fixtureがrepository上の一時的・無関係なworkflowを継承しないようworkflow集合をケース単位で隔離する保守releaseである。'
          r = replace_once(r, old_release, new_release, 'README release sentence')
          readme.write_text(r, encoding='utf-8')

          state = Path('project/docs/CURRENT_STATE.md')
          c = state.read_text(encoding='utf-8')
          state_replacements = [
              ('Base version: `0.5.8`', 'Base version: `0.5.9`', 'CURRENT_STATE Base version'),
              ('Last verified: 2026-09-27 — Base v0.5.8 devflow-identity maintenance merged after exact-head hosted verification passed on Ubuntu PowerShell, Windows PowerShell Core, and Windows PowerShell 5.1; Base self-tests remained 105/105 with focused command, MCP-path, and devflow-identity regressions passing.',
               'Last verified: 2026-09-27 — Base v0.5.9 shape-probe fixture-isolation maintenance completed with deterministic workflow fixtures; the full Base verification gate passes with 106/106 self-tests and existing command, MCP-path, and devflow-identity regressions preserved.',
               'CURRENT_STATE last verified'),
              ('- Base v0.5.8 is the current Repository Base maintenance baseline.', '- Base v0.5.9 is the current Repository Base maintenance baseline.', 'CURRENT_STATE maintenance baseline'),
              ('- Base v0.5.8 is the current Phase 5 safety baseline;', '- Base v0.5.9 is the current Phase 5 safety baseline;', 'CURRENT_STATE Phase 5 baseline'),
              ('- Hosted Base v0.5.8 verification: 105/105 Base self-tests, 8/8 command-runner regressions, 4/4 MCP path regressions, and the devflow identity regression passed on Ubuntu PowerShell, Windows PowerShell Core, and Windows PowerShell 5.1',
               '- Hosted Base v0.5.9 acceptance gate: 106/106 Base self-tests, 8/8 command-runner regressions, 4/4 MCP path regressions, the devflow identity regression, and deterministic shape-fixture isolation must pass on Ubuntu PowerShell, Windows PowerShell Core, and Windows PowerShell 5.1 before merge',
               'CURRENT_STATE hosted verification')
          ]
          for old, new, label in state_replacements:
              c = replace_once(c, old, new, label)
          state.write_text(c, encoding='utf-8')

      - name: Refresh Base index
        shell: pwsh
        run: |
          ./.kinotch/scripts/knt.ps1 base-refresh

      - name: Verify fixed shape fixture and complete Base gate
        shell: pwsh
        run: |
          ./.kinotch/scripts/knt.ps1 base-check
          ./.kinotch/scripts/knt.ps1 doctor
          ./.kinotch/scripts/knt.ps1 verify

      - name: Commit verified implementation and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'KiNoTch. automation'
          git config user.email '79015263+kinoko34077@users.noreply.github.com'
          git rm .github/workflows/issue18-shape-fixture-apply.yml
          git add .kinotch/BASE_VERSION .kinotch/README_BASE.md .kinotch/base-files.json .kinotch/tests/run-tests.ps1 project/docs/CURRENT_STATE.md
          git status --short
          git commit -m 'fix: isolate shape-probe workflow fixtures'
          git push origin HEAD:fix/issue-18-shape-fixture-isolation
